<section class="newsletter" id="newsletter" aria-labelledby="newsletter-title">
  <div class="wrap newsletter-inner">
    <div class="stack">
      <p class="label">Mailing list</p>
      <h2 id="newsletter-title">Stay in the loop.</h2>
      <p>Events, pitch nights and portfolio news. Unsubscribe anytime.</p>
    </div>
    <form class="signup" data-signup novalidate>
      <label class="full" for="signup-email">Email
        <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </label>
      <label for="signup-name">Name
        <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="First and last">
      </label>
      <label for="signup-role">I'm mostly…
        <select id="signup-role" name="role">
          <option value="curious">Curious</option>
          <option value="investor">Investing</option>
          <option value="founder">Founding a startup</option>
        </select>
      </label>
      <button class="btn" type="submit">Subscribe</button>
      <p class="form-note" data-form-note role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
